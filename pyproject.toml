[project]
name = "s-a-f-e-r"
version = "0.1.0"
description = "S.A.F.E.R Facial Recognition Module"
readme = "README.md"
requires-python = "==3.10.20"
dependencies = [
    "numpy<2",
    "opencv-python",
    "pandas>=2.0",
    "pydantic",
    "pymysql",
    "ruff",
    "sqlalchemy",
    "dlib",
    "face-recognition",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    "streamlit>=1.58.0",
    "plotly>=6.8.0",
    "plotly-express>=0.4.1",
]

[tool.uv.sources]
dlib = { path = "facial/utils/dlib-19.22.99-cp310-cp310-win_amd64.whl" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=. --cov-report=term --cov-fail-under=60"
