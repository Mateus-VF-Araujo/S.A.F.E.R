[project]
name = "s-a-f-e-r"
version = "0.1.0"
description = "S.A.F.E.R Facial Recognition Module"
readme = "README.md"
requires-python = "==3.10.20"
dependencies = [
    "numpy<2",
    "opencv-python",
    "pandas>=2.0",
    "pydantic",
    "pymysql",
    "ruff",
    "sqlalchemy",
    "dlib",
    "face-recognition",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    "streamlit>=1.58.0",
    "plotly>=6.8.0",
    "plotly-express>=0.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
dlib = { path = "facial/utils/dlib-19.22.99-cp310-cp310-win_amd64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=database.functions",
    "--cov=database.models",
    "--cov=facial.access_database",
    "--cov=facial.model_stream",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
