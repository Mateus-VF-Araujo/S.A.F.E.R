name: CI - Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libopenblas-dev
    
    - name: Instalar dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy opencv-python
    
    - name: Verificar arquivos (debug)
      run: |
        echo "=== Arquivos na raiz ==="
        ls -la
        echo "=== Pasta tests ==="
        ls -la tests/ || echo "Pasta tests não encontrada"
    
    - name: Executar testes
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Verificar cobertura mínima
      run: |
        python -m pytest tests/ --cov=. --cov-report=term --cov-fail-under=60 || true
